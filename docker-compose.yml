services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
      - path: .env.local
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      WITH_REDIS: "true"
      REDIS_URL: redis://redis:6379
      TRUST_PROXY: "true"
      LOGGER: "true"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
